name: Android Release Build & Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew || true
          # Decode release keystore if provided in secrets
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "Decoded release keystore from secrets."
          fi

          # Prepare debug keystore fallback
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          touch local.properties

      - name: Build Signed Release APK & Bundle
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEYSTORE_PATH: my-upload-key.jks
        run: |
          if [ -f "my-upload-key.jks" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Building signed release APK & AAB..."
            ./gradlew assembleRelease bundleRelease --stacktrace
            
            # Find built release APK and verify with apksigner
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -f "$APK_PATH" ]; then
              echo "Found release APK: $APK_PATH"
              echo "Verifying release APK signature..."
              $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK_PATH" || \
              $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK_PATH" || \
              apksigner verify --verbose "$APK_PATH" || true
              
              VERSION_TAG="${{ github.ref_name }}"
              [ -z "$VERSION_TAG" ] && VERSION_TAG="v1.0.0"
              cp "$APK_PATH" "SIGMA-${VERSION_TAG}-release.apk"
              echo "Created standalone signed release package: SIGMA-${VERSION_TAG}-release.apk"
            fi
          else
            echo "Release keystore secrets not present. Building assembleDebug..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sigma-release-builds
          path: |
            SIGMA-*.apk
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          compression-level: 0
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SIGMA-*.apk
            app/build/outputs/bundle/**/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
